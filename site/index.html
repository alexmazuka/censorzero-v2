<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CensorZero — Ukrinform / IMI parket audit</title>
<meta name="description" content="Reproducible audit of the parket/balance signals IMI cited about Ukrinform, across three editorial periods.">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!-- All visible text and every number are injected by app.js from
     figures.json (numbers) and the i18n dictionary (labels). The static HTML
     is intentionally free of study numbers; scripts/check_no_hardcoded_numbers.py
     enforces this. -->
<header id="topbar">
  <div class="wrap bar">
    <span class="brand" data-i18n="brand"></span>
    <nav id="nav"></nav>
    <button id="lang" class="lang"></button>
  </div>
</header>

<section id="coi" class="coi"><div class="wrap"><strong data-i18n="coi_title"></strong>
  <span data-i18n="coi_body"></span></div></section>

<main class="wrap">
  <section id="press">
    <h1 data-i18n="press_h"></h1>
    <div class="press-card">
      <h3 data-i18n="press_what_h"></h3>
      <p id="press-what"></p>
      <h3 data-i18n="press_findings_h"></h3>
      <ol>
        <li id="press-f1"></li>
        <li id="press-f2"></li>
        <li id="press-f3"></li>
      </ol>
      <h3 data-i18n="press_verify_h"></h3>
      <p data-i18n="press_verify"></p>
      <pre class="cmd" id="press-cmd"></pre>
      <p class="fine" data-i18n="press_verify2"></p>
    </div>
    <div class="cta-row">
      <button class="cta-btn cta-primary" id="cta-articles" data-i18n="cta_articles"></button>
      <button class="cta-btn" id="cta-gold" data-i18n="cta_gold"></button>
    </div>
  </section>

  <section id="explorer">
    <h2 data-i18n="explorer_h"></h2>
    <p class="explainer" data-i18n="explorer_intro"></p>

    <div class="tabs" id="ex-tabs">
      <button class="tab-btn" data-tab="articles" data-i18n="tab_articles"></button>
      <button class="tab-btn" data-tab="gold" data-i18n="tab_gold"></button>
    </div>

    <div id="pane-articles" class="ex-pane">
      <p class="explainer" data-i18n="articles_intro"></p>
      <div class="chiprow" id="ex-outlet-chips"></div>
      <div id="ex-outlet-note"></div>
      <div class="chiprow" id="ex-period-chips"></div>
      <input type="search" id="ex-search" class="search-box">
      <div class="chiprow" id="ex-status-chips"></div>
      <div id="ex-loading" class="fine"></div>
      <div id="explorer-out"></div>
    </div>

    <div id="pane-gold" class="ex-pane" style="display:none">
      <p class="explainer" data-i18n="gold_intro"></p>
      <div class="chiprow" id="gold-status-chips"></div>
      <input type="search" id="gold-search" class="search-box">
      <div id="gold-explorer-out"></div>
    </div>
  </section>

  <section id="tldr">
    <h1 data-i18n="title"></h1>
    <p class="sub" data-i18n="subtitle"></p>
    <div id="verdict" class="verdict"></div>
    <div id="rates-table"></div>
    <p class="fine" data-i18n="rates_note"></p>
  </section>

  <section id="contrasts">
    <h2 data-i18n="contrasts_h"></h2>
    <div id="contrasts-table"></div>
    <p class="fine" data-i18n="contrasts_note"></p>
  </section>

  <section id="sensitivity">
    <h2 data-i18n="sens_h"></h2>
    <p data-i18n="sens_intro"></p>
    <div id="sens-controls" class="controls"></div>
    <div id="sens-out" class="sens-out"></div>
  </section>

  <section id="method">
    <h2 data-i18n="method_h"></h2>
    <div id="periods-list"></div>
    <div id="method-body"></div>
  </section>

  <section id="validation">
    <h2 data-i18n="valid_h"></h2>
    <div id="gold-out"></div>
  </section>

  <section id="verification">
    <h2 data-i18n="verif_h"></h2>
    <p data-i18n="verif_intro"></p>
    <pre class="cmd" id="repro-cmd"></pre>
    <div id="verif-badge"></div>
    <div id="hash-table"></div>
  </section>

  <section id="limits">
    <h2 data-i18n="limits_h"></h2>
    <ul id="limits-list"></ul>
  </section>

</main>

<footer><div class="wrap">
  <span data-i18n="footer"></span>
  <a id="repo-link" href="https://github.com/alexmazuka/censorzero-v2">GitHub</a>
  <a href="https://github.com/alexmazuka/censorzero-v2/blob/main/PREREGISTRATION.md" data-i18n="prereg_link"></a>
</div></footer>

<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
