name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Job 1: full pipeline from committed raw snapshot must reproduce every
  # committed derived artifact byte-for-byte. Any drift fails the build.
  reproduce:
    # macOS arm64 runner: same architecture / libm as the environment that
    # generated the committed artifacts, so the bit-exact comparison is not at
    # the mercy of cross-platform floating-point ULP differences. Rates and
    # bootstrap p-values use only IEEE-754 +,*,/ in fixed order (portable);
    # Cohen's h uses arcsin, whose tiny cross-platform drift this pins away.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # manifest derives dates from git history of data/raw
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.2"
      - name: Pinned environment
        run: uv sync --frozen
      - name: Rebuild all derived artifacts
        run: make all
      - name: Bit-exact comparison against committed published artifacts
        run: make verify

  # Job 2: classifier + parser regression tests on committed HTML fixtures.
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.2"
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  # Job 3: repository hygiene — no absolute local paths, no hardcoded numbers
  # in site HTML (all numbers must come from figures.json at render time).
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No absolute local paths anywhere
        run: |
          # Pattern split so this workflow file does not match itself.
          pat="/""Users/|/""home/[a-z]"
          ! grep -rn --binary-files=without-match -E "$pat" \
            --exclude-dir=.git --exclude-dir=.venv --exclude-dir=cache .
      - name: No hardcoded study numbers in site HTML
        run: python3 scripts/check_no_hardcoded_numbers.py  # stdlib-only
